name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # or your branch of choice
  pull_request:
    branches:
      - main  # or your branch of choice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # # Set up Docker Buildx
    # - name: Set up Docker Buildx
    #   uses: docker/setup-buildx-action@v2

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Debugging step: List contents of frontend directory
    - name: List contents of frontend directory
      run: |
        cd frontend
        ls -alh

    # Build the frontend image
    - name: Build frontend Docker image
      run: |
        cd frontend
        docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/frontend-image:${{ github.sha }} .

    # Build the backend image
    - name: Build backend Docker image
      run: |
        cd backend
        docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/backend-image:${{ github.sha }} .

    # Push images to Docker Hub
    - name: Push frontend Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend-image:${{ github.sha }}

    - name: Push backend Docker image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/backend-image:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    
    # Checkout code again
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up SSH and Deploy to VM
    - name: Set up SSH key
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy containers to VM
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          # Pull the latest images from Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-image:${{ github.sha }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/backend-image:${{ github.sha }}

          # Stop and remove old containers if any
          docker stop frontend backend || true
          docker rm frontend backend || true

          # Run the containers with the updated images
          docker run -d --name frontend -p 80:80 ${{ secrets.DOCKER_USERNAME }}/frontend-image:${{ github.sha }}
          docker run -d --name backend -p 3500:3500 ${{ secrets.DOCKER_USERNAME }}/backend-image:${{ github.sha }}

          # Optionally, run additional commands to ensure everything is working
          # docker logs frontend
          # docker logs backend
        EOF