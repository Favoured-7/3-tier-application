name: Deploy Three-Tier App to DockerHub and VM

on:
  push:
    branches:
      - main

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: DockerHub login (fixed)
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build and push frontend image
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-image:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-image:latest

      # Step 4: Build and push backend image
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-image:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-image:latest

      # Step 5: Set up SSH to VM
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Step 6: Deploy stack on VM using Docker Compose
      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io docker-compose
            fi

            # Pull the latest images from DockerHub
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-image:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/backend-image:latest

            # Stop and remove any existing containers (safe reset)
            docker-compose -f /home/${{ secrets.SSH_USER }}/docker-compose.yml down || true

            # Start the updated stack
            docker-compose -f /home/${{ secrets.SSH_USER }}/docker-compose.yml up -d --build
          EOF